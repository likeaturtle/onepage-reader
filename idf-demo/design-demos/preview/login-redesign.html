<!doctype html>
<!-- 登录页重设计预览：375×812，rpx 折半为 px；不是运行时页面。 -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 375px; height: 812px; background: #fbfaf6; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; color: #17181a; }
  .screen { position: relative; width: 375px; height: 812px; overflow: hidden; background: #fbfaf6; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px 0 24px; font-size: 12px; font-weight: 600; letter-spacing: .02em; }
  .capsule { width: 87px; height: 32px; border: .5px solid #e5e0d4; border-radius: 16px; display: flex; align-items: center; justify-content: space-evenly; color: #17181a; background: transparent; }
  .capsule .dots { font-size: 11px; letter-spacing: 1px; }
  .capsule .ring { width: 11px; height: 11px; border: 1.5px solid #17181a; border-radius: 50%; position: relative; }
  .capsule .ring::after { content: ""; position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #17181a; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .page { position: absolute; inset: 0; padding: 80px 28px 28px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 48px; height: 48px; flex: none; display: block; }
  .brand-copy { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .title { font-size: 26px; font-weight: 300; line-height: 1.1; letter-spacing: .02em; }
  .subtitle { font-size: 11px; line-height: 1.3; letter-spacing: .3em; color: #8b8578; }
  .today { margin-top: 48px; padding-bottom: 16px; border-bottom: .5px solid #17181a; }
  .today-kicker { display: block; font-size: 11px; line-height: 1.4; letter-spacing: .18em; color: #9a9487; }
  .today-row { display: flex; align-items: flex-end; gap: 12px; margin-top: 5px; }
  .today-day { font-size: 100px; font-weight: 200; line-height: .82; letter-spacing: -.04em; font-feature-settings: "tnum"; }
  .today-side { display: flex; flex-direction: column; gap: 2px; padding-bottom: 6px; font-size: 13px; line-height: 1.4; letter-spacing: .08em; color: #6f6b61; }
  .month { margin-top: 28px; }
  .month-week { display: flex; }
  .month-wd { flex: 1 1 0; min-width: 0; padding-bottom: 4px; text-align: center; font-size: 10px; line-height: 1.4; letter-spacing: .04em; color: #b0aa98; }
  .month-cell { flex: 1 1 0; min-width: 0; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #9a9487; font-feature-settings: "tnum"; }
  .month-day { display: flex; align-items: center; justify-content: center; width: 21px; height: 21px; border-radius: 50%; box-sizing: border-box; }
  .month-day.on { border: .5px solid #17181a; color: #17181a; }
  .foot { margin-top: auto; padding-top: 32px; }
  .error { display: none; margin-bottom: 12px; padding: 6px 0 6px 10px; border-left: 2px solid #9c3427; color: #9c3427; font-size: 12px; line-height: 1.7; }
  .cta { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; background: #1e3050; color: #fff; font-size: 15px; letter-spacing: .14em; border-radius: 2px; }
  .guest { display: flex; align-items: center; justify-content: center; min-height: 52px; }
  .guest-label { font-size: 14px; letter-spacing: .12em; color: #9a9487; }
  .dev { display: flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 4px; font-size: 11px; letter-spacing: .08em; color: #a39c8d; }
  @media (max-height: 760px) { .month { display: none; } }
</style>
</head>
<body>
<div class="screen">
  <div class="status"><span>9:41</span><span class="capsule"><span class="dots">•••</span><span class="ring"></span></span></div>
  <div class="page">
    <div class="brand">
      <img class="logo" src="../../miniprogram/CalCal_logo.png">
      <div class="brand-copy">
        <div class="title">墨程CalCal</div>
        <div class="subtitle">把日程写进墨水屏</div>
      </div>
    </div>
    <div class="today">
      <span class="today-kicker">今天 · 周二</span>
      <div class="today-row">
        <span class="today-day">24</span>
        <div class="today-side"><span>十一月</span><span>2026</span></div>
      </div>
    </div>
    <div class="month" aria-hidden="true">
      <div class="month-week" id="month-head"></div>
      <div id="month-body"></div>
    </div>
    <div class="foot">
      <div class="error"></div>
      <div class="cta">微信一键登录</div>
      <div class="guest"><span class="guest-label">游客模式</span></div>
      <div class="dev">开发模式登录</div>
    </div>
  </div>
</div>
<script>
  (function () {
    const now = new Date(2026, 10, 24);
    const year = now.getFullYear();
    const month = now.getMonth();
    const first = new Date(year, month, 1);
    const start = new Date(year, month, 1 - first.getDay());
    const days = new Date(year, month + 1, 0).getDate();
    const weeks = Math.ceil((first.getDay() + days) / 7);
    const initials = ['日', '一', '二', '三', '四', '五', '六'];
    document.getElementById('month-head').innerHTML =
      initials.map((day) => `<span class="month-wd">${day}</span>`).join('');
    let body = '';
    for (let week = 0; week < weeks; week += 1) {
      body += '<div class="month-week">';
      for (let index = 0; index < 7; index += 1) {
        const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + week * 7 + index);
        const inMonth = date.getMonth() === month;
        const today = inMonth && date.getDate() === 24;
        body += `<div class="month-cell">${inMonth
          ? `<div class="month-day ${today ? 'on' : ''}">${date.getDate()}</div>` : ''}</div>`;
      }
      body += '</div>';
    }
    document.getElementById('month-body').innerHTML = body;
  })();
</script>
</body>
</html>
